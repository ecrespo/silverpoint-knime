name: ci

on:
  pull_request:
  push:
    branches: [main, develop]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # Python 3.11: the version of the bundled environment (pixi.toml).
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: uv sync --locked
      - run: uv run python scripts/knime_api.py
      - run: uv run ruff check . && uv run ruff format --check .
      - run: uv run python scripts/make_nodes.py --check
      - run: uv run python scripts/conformance.py
      - run: uv run pytest

  # KN-REQ-009, H-4: the conformance kit and every node in the bundled environment itself (KNIME 5.9's
  # pins: Python 3.11, pandas 2.0), not only in the uv one.
  bundled:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: prefix-dev/setup-pixi@v0.9.1
        with:
          pixi-version: v0.47.0
          environments: test
          locked: true
      - run: pixi run -e test conformance
      - run: pixi run -e test test

  # KN-T-08: the update site, built with KNIME's bundling tool in the pixi environment.
  bundle:
    runs-on: ubuntu-latest
    needs: [test, bundled]
    steps:
      - uses: actions/checkout@v5
      # pixi 0.47: the version knime-extension-bundling 5.9 runs itself; pixi.lock is written by it (v6).
      - uses: prefix-dev/setup-pixi@v0.9.1
        with:
          pixi-version: v0.47.0
          environments: build
          locked: true
      - run: pixi run -e build build ./local-update-site
      - uses: actions/upload-artifact@v4
        with:
          name: silverpoint-knime-update-site
          path: local-update-site
